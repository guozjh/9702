  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {

    color: #4a5566; text-align: center;
  }
  .chip:hover { border-color: #b9c7db; background: #f5f8fc; color: #1f3a5f; }
  .chip.on { background: #002985; border-color: #002985; color: #fff; }
  .chip.on:hover { background: #0034a8; border-color: #0034a8; }
  .chip.disabled { opacity: .35; cursor: not-allowed; }
  .chip.disabled:hover { border-color: #e2e7ef; background: #fff; color: #4a5566; }

  /* 全选按钮统一尺寸：与 Year 的第一格同宽（62px） */
  .chip.selectAll {
    width: 62px; flex: none; display: inline-flex; align-items: center; justify-content: center;
    padding: 5px 2px;
  }
  #chipsDiff .chip.selectAll { width: auto; }

  /* 年份：每行 4 个等宽 */
  #chipsYear { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  #chipsYear .chip { padding: 5px 2px; }

  /* 试卷：每行 3 个等宽；全选单独占一行，具体项从第二行开始排 */
  #chipsPaper { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  #chipsPaper .chip { padding: 5px 2px; }
  #chipsYear .chip.selectAll,
  #chipsPaper .chip.selectAll { grid-column: 1 / -1; justify-self: start; }

  /* 板块：每行 1 个 */
  #chipsSection { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
  #chipsSection .chip { text-align: left; padding: 6px 12px; line-height: 1.35; white-space: normal; }
  #chipsSection .chip.selectAll {
    justify-self: start; text-align: center; padding: 5px 2px; line-height: 1.15;
  }

  /* 难度：每行 3 个等宽 */
  #chipsDiff { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  #chipsDiff .chip { padding: 5px 2px; }
  /* 难度：1→5 由绿到红（低饱和） */
  /* --dc 实底/未选中色，--dt 未选中文字（略加深保证可读） */
  #chipsDiff .chip:nth-child(2) { --dc: #4b8a2d; --dt: #457f2a; --dbg: #e8f0e4; --dbd: #c9dcc0; }
  #chipsDiff .chip:nth-child(3) { --dc: #9eba00; --dt: #7d9300; --dbg: #f2f6de; --dbd: #e2eab2; }
  #chipsDiff .chip:nth-child(4) { --dc: #f2b500; --dt: #b58600; --dbg: #fdf5de; --dbd: #fbe9b2; }
  #chipsDiff .chip:nth-child(5) { --dc: #eb7d2f; --dt: #c4671f; --dbg: #fceee4; --dbd: #f9d8c1; }
  #chipsDiff .chip:nth-child(6) { --dc: #de3e3e; --dt: #c23535; --dbg: #fbe6e6; --dbd: #f5c5c5; }
  #chipsDiff .chip:not(.selectAll) {
    color: var(--dt, var(--dc)); background: var(--dbg); border-color: var(--dbd);
  }
  #chipsDiff .chip:not(.selectAll):hover { background: #fff; border-color: var(--dc); }
  #chipsDiff .chip:not(.selectAll).on { background: var(--dc); border-color: var(--dc); color: #fff; }

  #questionList { flex: 1; overflow-y: auto; padding: 14px 20px; }

  /* 三个标签固定排成一行；宽度不够时压缩文字（省略号 + title 提示全文），不再换行 */
  .qCard .tags {

  .qCard .tags .tag.sec { flex-shrink: 999; min-width: 74px; }

  /* 标签：题目卡片与做题页共用同一套配色 */
  .tag {

  .tag.miss { background: #f1f3f6; color: #98a2b3; font-style: italic; }

  .optBtn.picked { border-color: #2f5a8a; background: #eef3fa; }
  .optBtn.picked .letter { background: #2f5a8a; color: #fff; }
  .optBtn.correct { border-color: #2f6f45; background: #e8f5ec; }
  .optBtn.correct .letter { background: #2f6f45; color: #fff; }
  .optBtn.wrong { border-color: #c0392b; background: #fdeaea; }
  .optBtn.wrong .letter { background: #c0392b; color: #fff; }
  .optBtn.locked { cursor: default; }
  #feedback { margin: 14px 2.75% 0; padding: 12px 14px; border-radius: 8px; font-size: 14px; display: none; }
  #feedback.show { display: block; }
  #feedback.ok { background: #e8f5ec; color: #2f6f45; border: 1px solid #9fd9b0; }
  #feedback.no { background: #fdeaea; color: #c0392b; border: 1px solid #f0b0aa; }

  #runnerNav {
    margin: 16px 0 0; padding: 0 2.75%; display: flex; align-items: center;
    justify-content: space-between; gap: 12px;
  }
  .navBtn {
    border: 2px solid #dde3ec; background: #fff; color: #1f3a5f; padding: 9px 22px;
    border-radius: 8px; font-size: 14px; cursor: pointer; transition: .12s; font-family: inherit;
  }
  .navBtn:hover:not(:disabled) { border-color: #5a86c0; background: #eef3fa; }
  .navBtn:disabled { opacity: .35; cursor: not-allowed; }
  #navPos { font-size: 13px; color: #6b7686; font-weight: bold; letter-spacing: .5px; }
  #autoHint {
    margin: 8px 0 0; min-height: 18px; text-align: center;
    font-size: 12.5px; color: #7a8493;
  }

  #sidePane {
    width: 260px; flex-shrink: 0; background: #fff; border-left: 1px solid #e0e4ea;
    display: flex; flex-direction: column; overflow-y: auto; padding: 14px;
  }
  /* 侧栏顶行：左＝正确率统计，右＝计时器 */
  #sideHead {
    display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
    padding-bottom: 9px; margin-bottom: 11px; border-bottom: 1px solid #eef1f5;
  }
  #accStat { font-size: 12px; color: #5b6576; font-variant-numeric: tabular-nums; }
  #accStat b { color: #1f3a5f; font-size: 13px; }
  #accStat .ok { color: #2f6f45; }
  #accStat .no { color: #c0392b; }
  .timer { font-size: 15px; color: #d35400; font-variant-numeric: tabular-nums; font-weight: 600; }
  #sidePane h4 { font-size: 13px; color: #1f3a5f; margin: 0 0 10px; }
  #numPanel { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; margin-bottom: 18px; }
  .numBtn {
    aspect-ratio: 1; border: 1px solid #dbe1ea; border-radius: 6px; background: #f2f4f7;
    font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    color: #556; transition: .1s;
  }
  .numBtn:hover { border-color: #5a86c0; }
  .numBtn.answered { background: #d6e8ff; border-color: #7aa8e0; color: #1f3a5f; font-weight: bold; }
  .numBtn.current { outline: 3px solid #002985; outline-offset: -1px; }
  .numBtn.correctMark { background: #c9ead4; border-color: #4dbf77; }
  .numBtn.wrongMark { background: #f6c9c4; border-color: #e07a6e; }

  .legend { font-size: 12px; color: #667; line-height: 1.9; }
  .legend .dot { display: inline-block; width: 12px; height: 12px; border-radius: 3px;
    margin-right: 6px; vertical-align: -1px; }

  #resultView { display: none; flex: 1; flex-direction: row; overflow: hidden; }
  #resultView.active { display: flex; }
  #resultBody { flex: 1; position: relative; overflow-y: auto; padding: 24px; }
  /* 结果页右侧题号导航：与做题页 #sidePane 同宽同风格 */
  #resultSide {
    width: 260px; flex-shrink: 0; background: #fff; border-left: 1px solid #e0e4ea;
    display: flex; flex-direction: column; overflow-y: auto; padding: 14px;
  }
  #resultSideHead {
    padding-bottom: 9px; margin-bottom: 11px; border-bottom: 1px solid #eef1f5;
    font-size: 12px; color: #5b6576; font-variant-numeric: tabular-nums;
  }
  #resultSideHead b { color: #1f3a5f; font-size: 13px; }
  #resultSide h4 { font-size: 13px; color: #1f3a5f; margin: 0 0 10px; }
  #resultNumPanel { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; margin-bottom: 16px; }
  #resultNumPanel .numBtn.correctMark { cursor: default; opacity: .55; }
  #resultNumPanel .numBtn.canJump:hover { border-color: #e07a6e; }
  /* 结果页内容宽度与做题页题目栏（#qWrap 880px）对齐 */
  #scoreCard {
    background: #fff; border-radius: 10px; padding: 24px; max-width: 880px; margin: 0 auto 20px;
    text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,.08);
  }
  #scoreCard .big { font-size: 46px; font-weight: bold; color: #2f6f45; }
  #scoreCard .pct { font-size: 18px; color: #778; margin-top: 6px; }
  #scoreCard .detail { font-size: 14px; color: #556; margin-top: 12px; }
  .wrongItem {
    background: #fff; border-radius: 10px; padding: 14px; max-width: 880px; margin: 0 auto 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
  }
  .wrongItem.focus { box-shadow: 0 0 0 3px #f3b8b1, 0 2px 8px rgba(0,0,0,.06); }
  /* 头部一行：题号 + 题目编号 + 板块/知识点/难度，全部是小标签 */
  .wrongItem .wid {
    display: flex; align-items: center; flex-wrap: nowrap; gap: 6px;
    margin-bottom: 9px; overflow: hidden;
  }
  .wrongItem .wid > * { flex: 0 0 auto; }
  .wrongItem .wid .tag.sec { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .wrongItem .wid .tag.topic { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .wrongItem img { max-width: 100%; border-radius: 6px; border: 1px solid #e0e4ea; }
  .wrongItem .ansLine { margin-top: 8px; font-size: 14px; }
  .wrongItem .ansLine .your { color: #c0392b; }
  .wrongItem .ansLine .right { color: #2f6f45; font-weight: bold; }

  #modal {
    position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none;
    align-items: center; justify-content: center; z-index: 999;
  }
  #modal.show { display: flex; }
  #modalBox {
    background: #fff; border-radius: 12px; padding: 26px 28px; max-width: 90vw;
    min-width: 320px; box-shadow: 0 10px 40px rgba(0,0,0,.3);
  }
  #modalBox h3 { margin: 0 0 14px; color: #1f3a5f; font-size: 17px; }
  #modalBox p { color: #556; font-size: 14px; line-height: 1.7; margin: 0 0 16px; }
  #modalBox .btns { display: flex; gap: 10px; justify-content: flex-end; }
  #modalBox button {
    border: none; padding: 9px 20px; border-radius: 6px; cursor: pointer; font-size: 14px;
    background: #002985; color: #fff;
  }
  #modalBox button:hover { background: #0034a8; }
  #modalBox button.ghost { background: #e8ecf2; color: #345; }
  #modalBox button.ghost:hover { background: #d8dee8; }

  /* 导出选项弹窗：4 个可勾选行 */
  #modalBox p.expOpts { display: flex; flex-direction: column; gap: 9px; margin: 0 0 18px; }
  .expRow {
    display: flex; align-items: center; gap: 9px; padding: 9px 12px;
    border: 1px solid #e2e7ef; border-radius: 8px; cursor: pointer;
    transition: .12s; font-size: 14px; color: #374151; user-select: none;
  }
  .expRow:hover { border-color: #b9c6d8; background: #f8fafd; }
  .expRow input { width: 16px; height: 16px; margin: 0; accent-color: #002985; cursor: pointer; }
  .expRow .expName { font-weight: 600; color: #1f3a5f; }
  .expRow .expHint { margin-left: auto; font-size: 12px; color: #98a2b3; }
  .expRow:has(input:checked) { border-color: #a9c0e4; background: #f3f7fd; }

  #toast {
    position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
    background: #002985; color: #fff; padding: 11px 24px; border-radius: 8px;
    font-size: 14px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 1000;
  }
  #toast.show { opacity: .96; }

  #imgPreview {
    position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none;
    align-items: center; justify-content: center; z-index: 1001; cursor: zoom-out;
  }
  #imgPreview.show { display: flex; }
  #imgPreview img { max-width: 94vw; max-height: 94vh; background: #fff; border-radius: 6px; }

  /* ============================================================
     登录门（云端模式）
     ============================================================ */
  #authGate {
    position: fixed; inset: 0; z-index: 9999; display: none;
    align-items: center; justify-content: center;
    background: radial-gradient(1200px 600px at 50% -10%, #e6ecfa 0%, #f2f4f7 62%, #edf0f5 100%);
  }
  #authGate.show { display: flex; }
  .authCard {
    width: 384px; max-width: calc(100vw - 32px); background: #fff; border-radius: 16px;
    padding: 30px 28px 20px; box-shadow: 0 18px 50px rgba(16,40,80,.14); border: 1px solid #e8ecf3;
  }
  .authLogo {
    width: 56px; height: 56px; border-radius: 50%; background: #002985; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 700; margin: 0 auto 12px;
  }
  .authCard h1 { font-size: 19px; text-align: center; margin: 0 0 4px; color: #12305a; letter-spacing: .5px; }
  .authCard .sub { text-align: center; color: #8b95a5; font-size: 12px; margin: 0 0 18px; }
  .authTabs { display: flex; background: #f1f4f9; border-radius: 9px; padding: 3px; margin-bottom: 16px; }
  .authTabs button {
    flex: 1; border: none; background: transparent; padding: 8px 0; border-radius: 7px;
    font-size: 13px; color: #5b6576; cursor: pointer; font-family: inherit;
  }
  .authTabs button.active { background: #fff; color: #002985; font-weight: 600; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .authField { margin-bottom: 12px; }
  .authField label { display: block; font-size: 12px; color: #6b7688; margin-bottom: 5px; }
  .authField input {
    width: 100%; padding: 10px 11px; border: 1px solid #dde3ec; border-radius: 8px;
    font-size: 14px; outline: none; background: #fbfcfe; color: #1f2937;
  }
  .authField input:focus { border-color: #8fb0e8; background: #fff; box-shadow: 0 0 0 3px rgba(0,41,133,.06); }
  #authSubmit {
    width: 100%; margin-top: 4px; padding: 11px 0; border: none; border-radius: 9px;
    background: #002985; color: #fff; font-size: 15px; cursor: pointer; font-family: inherit;
  }
  #authSubmit:hover { background: #00329f; }
  #authSubmit:disabled { background: #93a4c4; cursor: default; }
  #authMsg { min-height: 17px; font-size: 12.5px; color: #c0392b; margin: 2px 0 8px; line-height: 1.55; }
  #authMsg.ok { color: #2f6f45; }
  .authFoot { margin: 12px 0 0; text-align: center; font-size: 11.5px; color: #98a2b3; line-height: 1.7; }

  #userChip {
    display: flex; align-items: center; gap: 8px;
    margin-left: 8px; padding-left: 12px; border-left: 1px solid #e6eaf1;
  }
  #userChip .uname { font-size: 13px; color: #1f3a5f; font-weight: 600; }
  #userChip .urole { font-size: 11px; color: #64748b; background: #eef2f8; border-radius: 999px; padding: 2px 8px; }
  #btnLogout {
    border: 1px solid #e0e6ef; background: #fff; color: #64748b; border-radius: 7px;
    padding: 5px 10px; font-size: 12px; cursor: pointer; font-family: inherit;
  }
  #btnLogout:hover { background: #fdf3f2; color: #c0392b; border-color: #efc9c4; }

  /* ============================================================
     统计页（仅管理员）
     ============================================================ */
  #screenStats { flex-direction: column; background: #f2f4f7; }
  .statsWrap { flex: 1; overflow: hidden; display: flex; flex-direction: column; padding: 18px 28px 0; gap: 12px; }
  .statsHead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .statsHead h2 { margin: 0; font-size: 16px; color: #12305a; font-weight: 700; }
  .statsTabs { display: flex; gap: 4px; background: #e9edf4; border-radius: 9px; padding: 3px; }
  .statsTabs button {
    border: none; background: transparent; padding: 7px 14px; border-radius: 7px;
    font-size: 13px; color: #5b6576; cursor: pointer; font-family: inherit;
  }
  .statsTabs button.active { background: #fff; color: #002985; font-weight: 600; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .statsTools { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .statsTools input, .statsTools select {
    padding: 7px 10px; border: 1px solid #dde3ec; border-radius: 8px;
    font-size: 13px; font-family: inherit; background: #fff; outline: none; color: #1f2937;
  }
  .statsTools button {
    padding: 7px 13px; border: 1px solid #dde3ec; background: #fff; border-radius: 8px;
    font-size: 13px; cursor: pointer; font-family: inherit; color: #374151;
  }
  .statsTools button:hover { background: #f5f7fa; }
  #statsBody {
    flex: 1; overflow: auto; background: #fff; border: 1px solid #e9ecf1;
    border-radius: 12px; margin-bottom: 18px;
  }
  .statTable { width: 100%; border-collapse: collapse; font-size: 13px; }
  .statTable th, .statTable td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #f0f2f6; white-space: nowrap; }
  .statTable th { position: sticky; top: 0; background: #fafbfd; color: #5b6576; font-weight: 600; z-index: 2; }
  .statTable th.sortable { cursor: pointer; user-select: none; }
  .statTable th.sortable:hover { color: #002985; }
  .statTable th .arrow { color: #b6c0cf; font-size: 10px; margin-left: 3px; }
  .statTable td.num, .statTable th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .statTable tbody tr:hover { background: #f7faff; }
  .statTable .mono { font-family: Consolas, "Courier New", monospace; font-size: 12px; color: #33445c; }
  .accBar { display: inline-flex; align-items: center; gap: 7px; }
  .accBar .track { width: 60px; height: 6px; border-radius: 999px; background: #eef1f6; overflow: hidden; }
  .accBar .fill { display: block; height: 100%; border-radius: 999px; background: #2f8f5b; }
  .accBar .fill.mid { background: #d99a2b; }
  .accBar .fill.low { background: #c0392b; }
  .statEmpty { padding: 44px 20px; text-align: center; color: #98a2b3; font-size: 13.5px; line-height: 1.95; }
  .statsPager {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    border-top: 1px solid #f0f2f6; position: sticky; bottom: 0; background: #fff;
    font-size: 12.5px; color: #64748b;
  }
  .statsPager .spacer { flex: 1; }
  .statsPager button {
    border: 1px solid #dde3ec; background: #fff; border-radius: 7px; padding: 5px 11px;
    font-size: 12.5px; cursor: pointer; font-family: inherit; color: #374151;
  }
  .statsPager button:disabled { color: #c2c9d4; cursor: default; background: #fafbfd; }

  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- 登录门：只有配置了 Supabase 才会显示 -->
<div id="authGate">
  <div class="authCard">
    <div class="authLogo">P</div>
    <h1>9702 题库</h1>
    <p class="sub">请登录后使用</p>

    <div class="authTabs">
      <button type="button" id="tabStudent" class="active">用户登录</button>
      <button type="button" id="tabAdmin">管理员登录</button>
    </div>

    <form id="authForm" autocomplete="off">
      <div class="authField">
        <label for="authUser">登录名</label>
        <input id="authUser" type="text" placeholder="输入老师发给你的登录名" spellcheck="false">
      </div>
      <div class="authField hidden" id="authPwdWrap">
        <label for="authPwd">密码</label>
        <input id="authPwd" type="password" placeholder="管理员密码">
      </div>
      <div id="authMsg"></div>
      <button type="submit" id="authSubmit">登 录</button>
    </form>

    <p class="authFoot">登录名由老师统一注册，忘记或需要开通请联系老师</p>
  </div>
</div>

<div id="topbar">
  <span class="logo">9702题库</span>
  <span class="spacer"></span>
  <button class="tbBtn active" id="navBuild" data-screen="screenCreate">组卷</button>
  <button class="tbBtn" id="navPractice" data-screen="screenTake">练习</button>
  <button class="tbBtn hidden" id="navStats" data-screen="screenStats">统计</button>
  <div id="userChip" class="hidden">
    <span class="uname" id="userName"></span>
    <span class="urole" id="userRole"></span>
    <button type="button" id="btnLogout">退出</button>
  </div>
</div>

<div class="screen" id="screenStats">
  <div class="statsWrap">
    <div class="statsHead">
      <h2 id="statsTitle">教学统计</h2>
      <div class="statsTabs">
        <button type="button" data-tab="users" class="active">用户总览</button>
        <button type="button" data-tab="questions">题目统计</button>
        <button type="button" data-tab="sections">板块正确率</button>
      </div>
      <div class="statsTools" id="statsTools"></div>
    </div>
    <div id="statsBody"></div>
  </div>
</div>

<div class="screen active" id="screenCreate">
  <div id="filterPane">
    <div class="filterBlock" data-filter="year">
      <div class="filterHead"><span class="title">Year 年份</span><span class="arrow">▼</span></div>
      <div class="filterBody"><div class="chips" id="chipsYear"></div></div>
    </div>

    <div class="filterBlock collapsed" data-filter="paper">
      <div class="filterHead"><span class="title">Paper 试卷</span><span class="arrow">▼</span></div>
      <div class="filterBody"><div class="chips" id="chipsPaper"></div></div>
    </div>

    <div class="filterBlock" data-filter="section">
      <div class="filterHead"><span class="title">Section 板块</span><span class="arrow">▼</span></div>
      <div class="filterBody"><div class="chips" id="chipsSection"></div></div>
    </div>

    <div class="filterBlock" data-filter="topic">
      <div class="filterHead"><span class="title">Topic 知识点</span><span class="arrow">▼</span></div>
      <div class="filterBody"><div class="chips" id="chipsTopic"></div></div>
    </div>

    <div class="filterBlock" data-filter="difficulty">
      <div class="filterHead"><span class="title">Difficulty</span><span class="arrow">▼</span></div>
      <div class="filterBody"><div class="chips" id="chipsDiff"></div></div>
    </div>

    <div id="filterTip">@Michael.Guo</div>

    <div id="paneFoot">
      <button id="btnImportCsv">导入题库 CSV</button>
      <span id="libInfo"></span>
    </div>
  </div>

  <div id="centerPane">
    <div id="resultBar">
      <span id="foundCount">共 <b>0</b> 道题</span>
      <span class="randGroup">随机抽题 <input type="number" id="randN" min="1" value="10"> 道</span>
      <button id="btnRandom">随机加入练习</button>
      <span class="spacer" style="flex:1"></span>
      <label style="font-size:13px;color:#5b6576">
        <input type="checkbox" id="selectAllList"> 全选当前列表
      </label>
    </div>
    <div id="questionList"></div>
  </div>

  <div id="poolPane">
    <div id="poolHead">
      <h3>已加入练习（<span id="poolCount">0</span>）</h3>
      <div class="poolActions">
        <button id="btnSortPool" title="按编号 / 知识点 / Difficulty 排序">排序</button>
        <button id="btnClearPool" title="清空已加入的题目">清空</button>
      </div>
    </div>
    <div id="poolList"></div>
    <div id="poolFooter">
      <input type="text" id="practiceName" placeholder="给这个练习起个名字（必填）">
      <button id="btnSavePractice">保存到我的练习</button>
    </div>
  </div>
</div>

<div class="screen" id="screenTake">
  <div id="takeList"></div>

  <div id="runner">
    <div id="runnerTop">
      <span class="rname" id="runnerName">—</span>
      <span class="qid-pill" id="runnerQid"></span>
      <span class="tag sec" id="runnerSec"></span>
      <span class="tag topic" id="runnerTopic"></span>
      <span class="tag diff" id="runnerDiff"></span>
      <span class="spacer"></span>
      <span id="modeLabel" style="font-size:12px;color:#778"></span>
      <button id="btnExitPractice">保存并退出</button>
      <button class="submit hidden" id="btnSubmitPractice">提交批改</button>
    </div>
    <div id="runnerBody">
      <div id="qArea">
        <div id="qWrap">
          <img class="qImg" id="qImg" alt="">
          <div class="opts" id="optArea"></div>
          <div id="feedback"></div>
          <div id="runnerNav">
            <button class="navBtn" id="btnPrevQ">← 上一题</button>
            <span id="navPos"></span>
            <button class="navBtn" id="btnNextQ">下一题 →</button>
          </div>
          <div id="autoHint"></div>
        </div>
      </div>
      <div id="sidePane">
        <div id="sideHead">
          <span id="accStat"></span>
          <span class="timer" id="timer">00:00</span>
        </div>
        <h4>题号导航</h4>
        <div id="numPanel"></div>
        <div class="legend">
          <div><span class="dot" style="background:#d6e8ff;border:1px solid #7aa8e0"></span>已作答</div>
          <div><span class="dot" style="background:#fff;border:1px solid #c8d0dc"></span>未作答</div>
          <div id="legendMark" class="hidden">
            <div><span class="dot" style="background:#c9ead4;border:1px solid #4dbf77"></span>答对</div>
            <div><span class="dot" style="background:#f6c9c4;border:1px solid #e07a6e"></span>答错</div>
          </div>
        </div>
      </div>

        <div><span class="dot" style="background:#c9ead4;border:1px solid #4dbf77"></span>答对</div>
        <div><span class="dot" style="background:#f6c9c4;border:1px solid #e07a6e"></span>答错 / 未答</div>

<script>
/* ============================================================
   常量
   ============================================================ */
const CSV_COLUMNS = ["id","section","topic","type","image","stem",
  "optionA","optionB","optionC","optionD","answer","explanation",
  "marks","difficulty","source"];

const LS_LIB = "qbank_lib_v1";
const LS_VER = "qbank_lib_ver_v1";   // 内置题库版本；和内置版本不一致就用内置数据重建，防止旧缓存盖住新标注
let LS_PRACTICES = "qbank_practices_v1";    // 云端模式下会追加 @用户名，做到账号之间互不干扰
let LS_PROGRESS = "qbank_progress_v1";

/* ============================================================
   季节（考季）定义
   s = 夏季 May/June ｜ m = 春季 Feb/Mar ｜ w = 冬季 Oct/Nov
   order 用于同一年的卷号排序（1 月 → 5/6 月 → 10/11 月）
   ============================================================ */
const SESSION_INFO = {
  m: { en: 'Feb/Mar',  cn: '春季', order: 1 },
  s: { en: 'May/June', cn: '夏季', order: 2 },
  w: { en: 'Oct/Nov',  cn: '冬季', order: 3 }
};

/* ============================================================
   ★ 考纲标准顺序（Section / Topic），数据源 = Topics.txt
   用于修正 S1,S10,S11 这类字符串排序错误，以及 Topic 的考纲顺序
   ============================================================ */
const SYLLABUS = [
  { sec: "S1 - Physical quantities and units",
    topics: [
      "Fundamental physical quantities", "Derived physical quantities", "Prefixes",
      "Systematic error and random error", "Uncertainty", "Scalars and vectors",
      "Combining vectors", "Resolve vectors"
    ] },
  { sec: "S2 - Kinematics",
    topics: [
      "General kinematics", "Gradient of kinematic graph", "Area of kinematic graph",
      "Uniform acceleration equations", "Projectile motion"
    ] },
  { sec: "S3 - Dynamics",
    topics: [
      "Mass and weight", "Newton's 1st law", "Newton's 2nd law",
      "Newton's 3rd law", "Free fall with air resistance", "Common dynamics models"
    ] },
  { sec: "S4 - Momentum",
    topics: [
      "Conservation of momentum", "Momentum and force", "Elastic collision",
      "Two dimensions collision"
    ] },
  { sec: "S5 - Moment",
    topics: [
      "Principle of moments", "Couple and torque"
    ] },
  { sec: "S6 - Work, energy and power",
    topics: [
      "Work done and gravitational potential energy", "Kinetic energy", "Conservation of energy",
      "Power", "Efficiency"
    ] },
  { sec: "S7 - Deformation of solids",
    topics: [
      "Density", "Pressure", "Upthrust",
      "Elastic and plastic", "Elastic potential energy", "Combined springs",
      "Young modulus"
    ] },
  { sec: "S8 - Electricity",
    topics: [
      "Charge and electron", "Average drift speed", "Potential difference and power",
      "Ohm's law", "Resistivity", "Combined resistance",
      "Internal resistance", "Electric circuit", "Kirchhoff’s laws",
      "Potential dividers", "Null method"
    ] },
  { sec: "S9 - Waves",
    topics: [
      "Transverse waves", "Longitudinal waves", "Cathode-ray oscilloscope",
      "Doppler effect", "Electromagnetic spectrum", "Intensity",
      "Polarisation"
    ] },
  { sec: "S10 - Superposition",
    topics: [
      "Diffraction", "Superposition", "Double-slit experiment",
      "The diffraction grating", "Stationary wave"
    ] },
  { sec: "S11 - Particle physics",
    topics: [
      "α-particle scattering experiment", "Nuclide and isotopes", "Decay",
      "Decay chain", "Quarks", "Hadron and lepton"
    ] },
  { sec: "S12 - Estimation and Measurement",
    topics: [
      "Estimation", "Measurement"
    ] },
  { sec: "S13 - Old syllabus",
    topics: [
      "Thermodynamics", "Work done on gas", "Electric field"
    ] },
];

/* —— 由 SYLLABUS 派生的顺序索引 —— */
function normKey(s) {
  return String(s || '')
    .replace(/[\u2018\u2019]/g, "'")   // 弯单引号 → 直引号
    .replace(/[\u201C\u201D]/g, '"')
    .replace(/\s+/g, ' ')
    .trim()
    .toLowerCase();
}
const SEC_ORDER = new Map();    // 归一化 section 名 → 考纲序号(0 起)
const TOPIC_META = new Map();   // 归一化 topic 名 → { sec, secIdx, idx, topic }
SYLLABUS.forEach((node, si) => {
  SEC_ORDER.set(normKey(node.sec), si);
  node.topics.forEach((t, ti) => {
    TOPIC_META.set(normKey(t), { sec: node.sec, secIdx: si, idx: ti, topic: t });
  });
});

/* 取 S 后面的数字：S1→1，S10→10，认不出的排到最后 */
function sectionNo(s) {
  const m = String(s || '').match(/^\s*S\s*(\d+)/i);
  return m ? parseInt(m[1], 10) : 9999;
}
/* Section 排序：先按数字，再按字典序 */
function cmpSection(a, b) {
  const na = sectionNo(a), nb = sectionNo(b);
  if (na !== nb) return na - nb;
  return String(a).localeCompare(String(b), 'en');
}
/* Section 在考纲中的位置；不在考纲内则退回数字序号 */
function secIndexOf(secName) {
  const k = normKey(secName);
  if (SEC_ORDER.has(k)) return SEC_ORDER.get(k);
  return sectionNo(secName);
}

/* ============================================================
   状态
   ============================================================ */
let LIB = [];
let PRACTICES = {};
let PROGRESS = {};

/* ★ 每个维度：{ all: true/false, set: Set } */
const filterState = {
  year:       { all: true, set: new Set() },
  paper:      { all: true, set: new Set() },
  section:    { all: true, set: new Set() },
  topic:      { all: true, set: new Set() },
  difficulty: { all: true, set: new Set() }
};
let pool = [];
let runner = null;
let currentFiltered = [];

/* ============================================================
   工具
   ============================================================ */
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._tid);
  t._tid = setTimeout(() => t.classList.remove('show'), 1800);
}
function saveLS(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e){} }
function loadLS(key, def) { try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : def; } catch(e){ return def; } }

function fmtTime(sec) {
  sec = Math.max(0, Math.floor(sec));
  const m = String(Math.floor(sec/60)).padStart(2,'0');
  const s = String(sec%60).padStart(2,'0');
  return m+':'+s;
}

/* 练习名称等文本插入 innerHTML 前的转义 */
function esc(str) {
  return String(str).replace(/[&<>"']/g, c => (
    { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]
  ));
}

/* 板块全名：'S1 - Physical quantities and units' → 'S1 Physical quantities and units' */
function secFull(section) {
  return String(section || '').replace(/\s+-\s+/g, ' ').trim();
}
/* 板块序号：'S12 - ...' → 12 */
function secOrder(section) {
  const m = /^S\s*(\d+)/i.exec(String(section || ''));
  return m ? parseInt(m[1], 10) : 99;
}

function parseCSV(text) {
  text = text.replace(/^\uFEFF/, '');
  const rows = [];
  let field = '', row = [], inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i], n = text[i+1];
    if (inQuotes) {
      if (c === '"' && n === '"') { field += '"'; i++; }
      else if (c === '"') { inQuotes = false; }
      else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\r') {}
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else field += c;
    }
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.length > 1 || (r.length === 1 && r[0] !== ''));
}

function loadLibFromCSV(text) {
  const grid = parseCSV(text);
  if (!grid.length) { alert('CSV 内容为空。'); return false; }
  let headerIdx = -1;
  for (let i = 0; i < grid.length; i++) {
    const low = grid[i].map(s => s.trim().toLowerCase());
    if (low.includes('id') && low.includes('section')) { headerIdx = i; break; }
  }
  if (headerIdx === -1) { alert('没找到表头行。'); return false; }
  const header = grid[headerIdx].map(s => s.trim());
  const colIdx = {};
  CSV_COLUMNS.forEach(c => {
    const k = header.findIndex(h => h.toLowerCase() === c.toLowerCase());
    if (k >= 0) colIdx[c] = k;
  });

  const rows = [];
  for (let i = headerIdx + 1; i < grid.length; i++) {
    const g = grid[i];
    if (!g || g.length === 0 || (g.length === 1 && g[0].trim() === '')) continue;
    const low = g.map(s => (s||'').trim().toLowerCase());
    if (low.includes('id') && low.includes('section') && low.includes('image')) continue;
    const id = (g[colIdx.id] || '').trim();
    if (!id) continue;
    const obj = {};
    CSV_COLUMNS.forEach(c => { obj[c] = (colIdx[c] !== undefined) ? (g[colIdx[c]] || '') : ''; });
    obj.id = id;
    rows.push(obj);
  }
  if (!rows.length) { alert('没有解析到任何题目行。'); return false; }
  LIB = rows;
  saveLS(LS_LIB, LIB);
  return true;
}

/* ============================================================
   id 解析
   9702_s16_qp_12_q01 → 2016 年 夏季 试卷 11 题 01
   9702_[smw]YY_qp_XX_qNN
     [smw]  s=夏季(May/June)  m=春季(Feb/Mar)  w=冬季(Oct/Nov)
     YY     年份后两位
     XX     卷号（11/12/13 = Paper 1 Variant 1/2/3）
     NN     题号
   ★ paper 字段统一为「季节字母 + 卷号」，如 s11 / w11 / m11
   ============================================================ */
function parseId(id) {
  const res = { year:'', ses:'', code:'', paper:'', session:'', variant:'' };
  const m = String(id).match(/9702[_-]([a-zA-Z])(\d{2})[_-]qp[_-](\d{2})/i);
  if (m) {
    const ses = m[1].toLowerCase();
    const yy = parseInt(m[2], 10);
    const info = SESSION_INFO[ses];
    res.ses = ses;
    res.code = m[3];                 // 卷号：11 / 12 / 13
    res.paper = ses + m[3];          // ★ 带季节前缀：s11 / w11 / m11
    res.variant = m[3];
    res.year = String(2000 + yy);
    res.session = info ? info.en : ses;
    return res;
  }
  /* 兜底：id 不含季节字母时，原样返回卷号 */
  const m2 = String(id).match(/qp[_-](\d+)/i);
  if (m2) { res.code = m2[1]; res.paper = m2[1]; }
  return res;
}

/* 卷号的完整可读描述，用于气泡提示 */
function paperTitle(o) {
  const info = SESSION_INFO[o.ses];
  if (!info) return o.year + ' ' + o.paper;
  return `${info.cn} ${info.en} ${o.year} · Paper ${o.code}`;
}

/* ============================================================
   初始化
   ============================================================ */
function initData() {
  /* ★ 内置题库版本守卫：
     每次用新的 题库骨架_已标注.csv 重新打包时 EMBEDDED_VER 会变，
     此时丢掉浏览器里的旧题库（否则新标注／新考点永远不生效）。
     用户手动导入 CSV 后会把版本补成当前值，所以自己的导入不会被覆盖。 */
  const savedVer = loadLS(LS_VER, '');
  if (savedVer !== EMBEDDED_VER) {
    if (loadLibFromCSV(EMBEDDED_CSV)) {
      saveLS(LS_VER, EMBEDDED_VER);
      showToast(`内置题库已更新（${LIB.length} 题）`);
    } else {
      LIB = loadLS(LS_LIB, []);
    }
  } else {
    LIB = loadLS(LS_LIB, []);
  }
  PRACTICES = loadLS(LS_PRACTICES, {});
  PROGRESS = loadLS(LS_PROGRESS, {});
  refreshAll();
  renderPool();
  renderPracticeList();
  updateLibInfo();
}
function updateLibInfo() {
  document.getElementById('libInfo').textContent = LIB.length ? `题库共 ${LIB.length} 题` : '未导入题库';
}

/* ============================================================
   筛选数据源
   ============================================================ */
function getYears() {
  const s = new Set();
  LIB.forEach(q => { const p = parseId(q.id); if (p.year) s.add(p.year); });
  return [...s].sort((a,b)=>b.localeCompare(a));
}
/* ★ 卷号列表：paper 形如 s11 / w11 / m11
   排序：年份倒序 → 同年按 冬季(w) > 夏季(s) > 春季(m) 倒序 → 卷号倒序 */
function getPapers(yearSet, yearAll) {
  const seen = new Set();
  const out = [];
  LIB.forEach(q => {
    const p = parseId(q.id);
    if (!p.paper) return;
    if (!yearAll && !yearSet.size) return;
    if (!yearAll && !yearSet.has(p.year)) return;
    const k = p.year + '|' + p.paper;
    if (seen.has(k)) return;
    seen.add(k);
    out.push({ paper:p.paper, year:p.year, ses:p.ses, code:p.code });
  });
  out.sort((a, b) => {
    if (a.year !== b.year) return b.year.localeCompare(a.year);
    const oa = (SESSION_INFO[a.ses] || {}).order || 0;
    const ob = (SESSION_INFO[b.ses] || {}).order || 0;
    if (oa !== ob) return ob - oa;
    return String(b.code).localeCompare(String(a.code));
  });
  return out;
}
/* ★ Section 按考纲顺序 S1 → S2 → … → S13 */
function getSections() {
  const s = new Set();
  LIB.forEach(q => { if (q.section) s.add(q.section); });
  return [...s].sort(cmpSection);
}
/* ★ Topic 按「所属 Section 考纲顺序 + Section 内考纲顺序」排序 */
function getTopicsBySections(secAll, secSet) {
  const map = new Map();   // topic → 原始 section 名
  LIB.forEach(q => {
    if (!q.topic || !q.section) return;
    if (!secAll && !secSet.size) return;
    if (!secAll && !secSet.has(q.section)) return;
    if (!map.has(q.topic)) map.set(q.topic, q.section);
  });
  const out = [];
  map.forEach((sec, topic) => {
    const meta = TOPIC_META.get(normKey(topic));
    out.push({
      topic,
      section: meta ? meta.sec : sec,
      secIdx: meta ? meta.secIdx : secIndexOf(sec),
      idx: meta ? meta.idx : 10000,   // 考纲里没有的 topic 排在该节末尾
      known: !!meta
    });
  });
  out.sort((a, b) => {
    if (a.secIdx !== b.secIdx) return a.secIdx - b.secIdx;
    if (a.known !== b.known) return a.known ? -1 : 1;
    if (a.idx !== b.idx) return a.idx - b.idx;
    return String(a.topic).localeCompare(String(b.topic), 'en');
  });
  return out;
}

/* ============================================================
   ★ 核心：统一重绘
   ============================================================ */
function refreshAll() {
  renderYearChips();
  renderPaperChips();
  renderSectionChips();
  renderTopicChips();
  renderDiffChips();
  applyFilters();
}

/* 通用：给一个维度构建 chips（含全选 + 具体项）
   ★ 修复点：isItemOn 回调传入的语义改为「全选态 → true」
   这里额外增加一个参数 dimAll 直接传入该维度的 all 值，避免回调里重复判断 */
function renderChipsGeneric(boxId, allLabel, items, isAllOn, isItemOn, onToggleAll, onToggleItem) {
  const box = document.getElementById(boxId);
  box.innerHTML = '';

  const allChip = document.createElement('div');
  allChip.className = 'chip selectAll' + (isAllOn ? ' on' : '');
  allChip.textContent = allLabel;
  allChip.onclick = onToggleAll;
  box.appendChild(allChip);

  if (!items.length) {
    const e = document.createElement('span');
    e.className = 'filterEmpty';
    e.textContent = '（无具体项）';
    box.appendChild(e);
    return;
  }
  let lastGroup = null;
  items.forEach(it => {
    /* ★ 支持分组标题：item.group 变化时插入一条分隔标题 */
    if (it.group && it.group !== lastGroup) {
      lastGroup = it.group;
      const g = document.createElement('div');
      g.className = 'chipGroup';
      g.textContent = it.group;
      box.appendChild(g);
    }
    const c = document.createElement('div');
    c.className = 'chip' + (isItemOn(it.key) ? ' on' : '');
    c.textContent = it.label;
    if (it.title) c.title = it.title;
    c.onclick = () => onToggleItem(it.key);
    box.appendChild(c);
  });
}

/* ---------- 各维度渲染 ---------- */

function renderYearChips() {
  const st = filterState.year;
  const items = getYears().map(y => ({ key:y, label:y }));
  renderChipsGeneric('chipsYear', '全选',
    items,
    st.all,
    /* ★ 全选态 → 全部点亮；具体态 → 只点亮已选项 */
    k => st.all || st.set.has(k),
    () => toggleAll('year'),
    k => toggleItem('year', k)
  );
}

function renderPaperChips() {
  const st = filterState.paper;
  const papers = getPapers(filterState.year.set, filterState.year.all);
  /* ★ 标签显示「2016 s11」，区分夏季/春季/冬季卷 */
  const items = papers.map(o => ({
    key: o.year + '|' + o.paper,
    label: o.year + ' ' + o.paper,
    title: paperTitle(o)
  }));
  renderChipsGeneric('chipsPaper', '全选',
    items,
    st.all,
    k => st.all || st.set.has(k),
    () => toggleAll('paper'),
    k => toggleItem('paper', k)
  );
}

function renderSectionChips() {
  const st = filterState.section;
  const items = getSections().map(s => {
    const m = s.match(/^(S\d+)\s*-\s*(.*)$/);
    return { key:s, label: m ? m[1] + ' ' + m[2] : s };
  });
  renderChipsGeneric('chipsSection', '全选',
    items,
    st.all,
    k => st.all || st.set.has(k),
    () => toggleAll('section'),
    k => toggleItem('section', k)
  );
}

function renderTopicChips() {
  const st = filterState.topic;
  const secAll = filterState.section.all;
  const secSet = filterState.section.set;

  const box = document.getElementById('chipsTopic');
  if (!secAll && !secSet.size) {
    box.innerHTML = '<span class="filterEmpty">请先在上方选择 Section，再挑选 Topic</span>';
    return;
  }
  /* ★ 已按 Section 考纲顺序 + Section 内考纲顺序排好，并带分组标题 */
  const rows = getTopicsBySections(secAll, secSet);
  const items = rows.map(r => ({
    key: r.topic,
    label: r.topic,
    group: r.section,
    title: r.known ? `${r.section} · ${r.topic}` : `${r.section} · ${r.topic}（不在 Topics.txt 大纲内）`
  }));
  renderChipsGeneric('chipsTopic', '全选',
    items,
    st.all,
    k => st.all || st.set.has(k),
    () => toggleAll('topic'),
    k => toggleItem('topic', k)
  );
}

function renderDiffChips() {
  const st = filterState.difficulty;
  const items = ['1','2','3','4','5'].map(d => ({ key:d, label:'Difficulty '+d }));
  renderChipsGeneric('chipsDiff', '全选',
    items,
    st.all,
    k => st.all || st.set.has(k),
    () => toggleAll('difficulty'),
    k => toggleItem('difficulty', k)
  );
}

/* ============================================================
   ★ 核心按钮逻辑
   ============================================================ */
function toggleAll(dim) {
  const st = filterState[dim];
  if (st.all) {
    /* 全选点亮 → 点一次 → 全部具体按钮熄灭 */
    st.all = false;
    st.set.clear();
    if (dim === 'section') {
      filterState.topic.all = false;
      filterState.topic.set.clear();
    }
  } else {
    /* 全选熄灭 → 点全选 → 重新点亮 */
    st.all = true;
    st.set.clear();
    if (dim === 'section') {
      filterState.topic.all = true;
      filterState.topic.set.clear();
    }
  }
  refreshAll();
}

function toggleItem(dim, key) {
  const st = filterState[dim];

  if (st.all) {
    /* 全选点亮时点具体项 → 该项亮、其余全灭 */
    st.all = false;
    st.set.clear();
    st.set.add(key);
    if (dim === 'section') {
      filterState.topic.all = true;
      filterState.topic.set.clear();
    }
  } else {
    /* 具体选择态 → 普通多选切换 */
    if (st.set.has(key)) st.set.delete(key);
    else st.set.add(key);
    if (dim === 'section') {
      filterState.topic.all = true;
      filterState.topic.set.clear();
    }
  }
  refreshAll();
}

function prunePaperIfNeeded() {
  const valid = new Set(getPapers(filterState.year.set, filterState.year.all).map(o => o.year+'|'+o.paper));
  if (!filterState.paper.all) {
    [...filterState.paper.set].forEach(k => { if (!valid.has(k)) filterState.paper.set.delete(k); });
  }
}

/* ============================================================
   核心筛选
   ============================================================ */
function dimPass(dim, val) {
  const st = filterState[dim];
  if (st.all) return true;
  return st.set.has(val);
}

function getFiltered() {
  return LIB.filter(q => {
    const p = parseId(q.id);
    if (!dimPass('year', p.year)) return false;
    if (!dimPass('paper', p.year + '|' + p.paper)) return false;
    if (!dimPass('section', q.section)) return false;
    if (!dimPass('topic', q.topic)) return false;
    if (!dimPass('difficulty', q.difficulty)) return false;
    return true;
  });
}

function applyFilters() {
  prunePaperIfNeeded();
  currentFiltered = getFiltered();
  document.getElementById('foundCount').innerHTML = `共 <b>${currentFiltered.length}</b> 道题`;
  renderQuestionList();
}

function renderQuestionList() {
  const box = document.getElementById('questionList');
  box.innerHTML = '';
  if (!currentFiltered.length) {
    box.innerHTML = '<div class="emptyHint">没有符合条件的题目</div>';
    return;
  }
  const MAXR = 300;
  currentFiltered.slice(0, MAXR).forEach(q => {
    const card = document.createElement('div');
    card.className = 'qCard';
    const checked = pool.includes(q.id) ? 'checked' : '';
    card.innerHTML = `
      <div class="checkWrap"><input type="checkbox" ${checked} data-id="${q.id}"></div>
      <img class="thumb" src="img/${q.image}" alt="" data-preview="img/${q.image}">
      <div class="meta">
        <div class="qid">${q.id}</div>
        <div class="tags">
          ${q.section?`<span class="tag sec" title="${esc(secFull(q.section))}">${esc(secFull(q.section))}</span>`:''}
          ${q.topic?`<span class="tag topic" title="${esc(q.topic)}">${esc(q.topic)}</span>`:`<span class="tag miss" title="题库里这道题没有填知识点">知识点未标注</span>`}
          ${q.difficulty?`<span class="tag diff d${q.difficulty}">Difficulty ${q.difficulty}</span>`:''}
        </div>
      </div>`;
    card.querySelector('input').onchange = (e) => {
      if (e.target.checked) addToPool(q.id); else removeFromPool(q.id);
    };
    card.querySelector('.thumb').onclick = () => previewImage('img/'+q.image);
    box.appendChild(card);
  });
  if (currentFiltered.length > MAXR) {
    const more = document.createElement('div');
    more.className = 'emptyHint';
    more.textContent = `仅显示前 ${MAXR} 条，共 ${currentFiltered.length} 条。请用筛选或随机抽题缩小范围。`;
    box.appendChild(more);
  }
}

/* ============================================================
   选题池 / 保存 / 随机 / 全选列表
   ============================================================ */
function addToPool(id) { if (!pool.includes(id)) pool.push(id); renderPool(); }
function removeFromPool(id) {
  pool = pool.filter(x => x !== id);
  renderPool();
  document.querySelectorAll(`#questionList input[data-id="${id}"]`).forEach(cb => cb.checked = false);
}
function renderPool() {
  document.getElementById('poolCount').textContent = pool.length;
  const clearBtn = document.getElementById('btnClearPool');
  if (clearBtn) clearBtn.disabled = pool.length === 0;
  const sortBtn = document.getElementById('btnSortPool');
  if (sortBtn) sortBtn.disabled = pool.length === 0;
  const box = document.getElementById('poolList');
  box.innerHTML = '';
  if (!pool.length) {
    box.innerHTML = '<div class="emptyHint">还没有选题<br>用左侧筛选 + 随机抽题/勾选加入</div>';
    return;
  }
  pool.forEach(id => {
    const item = document.createElement('div');
    item.className = 'poolItem';
    item.innerHTML = `<span class="pid" title="${id}">${id}</span><button class="rm" title="移除">×</button>`;
    item.querySelector('.rm').onclick = () => removeFromPool(id);
    box.appendChild(item);
  });
}

document.getElementById('btnClearPool').onclick = () => {
  if (!pool.length) return;
  confirmModal('清空选题', `确定清空已加入的 ${pool.length} 道题吗？`, () => {
    pool = [];
    document.getElementById('selectAllList').checked = false;
    renderPool();
    renderQuestionList();
    showToast('已清空选题');
  });
};

/* ---------- 已加入练习：按编号 / 知识点 / 难度排序 ---------- */
/* 编号键：年份 → 季节(春 m / 夏 s / 冬 w) → 卷号 → 题号 */
function idSortKey(id) {
  const p = parseId(id);
  const qn = parseInt((String(id).match(/q(\d+)/i) || [0, 0])[1], 10) || 0;
  const sesRank = ({ m: 0, s: 1, w: 2 })[p.ses];
  return [parseInt(p.year, 10) || 0, sesRank === undefined ? 9 : sesRank, parseInt(p.code, 10) || 0, qn];
}

function sortPool(kind, dir) {
  if (pool.length < 2) return;
  const map = new Map(LIB.map(q => [q.id, q]));
  const sign = dir === 'desc' ? -1 : 1;
  /* 知识点排序：严格按 Topics.txt（= SYLLABUS）的考纲顺序 —— 先板块，再板块内知识点顺序；
     Prefixes 排到 Area of kinematic graph 之前，不再按首字母。考纲里没有的 topic 退回板块末尾按名字排 */
  const topicKey = (q) => {
    const m = TOPIC_META.get(normKey(q.topic));
    if (m) return [m.secIdx, m.idx];
    return [secIndexOf(q.section), 9999];
  };
  const byTopic = (a, b) => {
    const ka = topicKey(a), kb = topicKey(b);
    if (ka[0] !== kb[0]) return ka[0] - kb[0];
    if (ka[1] !== kb[1]) return ka[1] - kb[1];
    /* 同一知识点内按编号排，保证顺序稳定 */
    return byId(a, b);
  };
  const byDiff = (a, b) => (parseInt(a.difficulty, 10) || 0) - (parseInt(b.difficulty, 10) || 0);
  const byId = (a, b) => {
    const ka = idSortKey(a.id), kb = idSortKey(b.id);
    for (let i = 0; i < ka.length; i++) if (ka[i] !== kb[i]) return ka[i] - kb[i];
    return 0;
  };
  const cmp = kind === 'topic' ? byTopic : kind === 'diff' ? byDiff : byId;
  pool.sort((x, y) => sign * cmp(map.get(x) || {}, map.get(y) || {}));
  renderPool();
  const ascName = { id: '编号', topic: '知识点', diff: 'Difficulty' }[kind] || '';
  const tail = kind === 'diff' ? (dir === 'desc' ? '（难 → 易）' : '（易 → 难）') : '';
  const dirName = dir === 'desc' ? '倒序' : '正序';
  showToast(kind === 'diff'
    ? `已按 Difficulty ${dirName}排列${tail}`
    : `已按${ascName}${dirName}排列${tail}`);
}

function openPoolSortMenu(btn) {
  const same = menuPracticeName === '__sort__' && !!cardMenuEl;
  hideCardMenu();
  if (same) return;

  const menu = document.createElement('div');
  menu.className = 'cardMenu';
  menu.setAttribute('popover', 'manual');
  const r = btn.getBoundingClientRect();
  const right = Math.max(8, window.innerWidth - r.right);
  const flipUp = r.bottom > window.innerHeight - 235;   /* 6 项菜单约 215px 高 */
  menu.style.cssText = 'inset:auto; margin:0; min-width:132px;' + `right:${right}px;` + (flipUp
    ? `bottom:${window.innerHeight - r.top + 6}px;`
    : `top:${r.bottom + 6}px;`);
  menu.innerHTML = `
    <button data-sort="id:asc">编号 ↑</button>
    <button data-sort="id:desc">编号 ↓</button>
    <button data-sort="topic:asc">知识点 ↑</button>
    <button data-sort="topic:desc">知识点 ↓</button>
    <button data-sort="diff:asc">Difficulty ↑</button>
    <button data-sort="diff:desc">Difficulty ↓</button>`;
  menu.querySelectorAll('button').forEach(b => {
    b.onclick = () => {
      hideCardMenu();
      const [kind, dir] = b.dataset.sort.split(':');
      sortPool(kind, dir);
    };
  });
  document.body.appendChild(menu);
  cardMenuEl = menu;
  menuPracticeName = '__sort__';
  if (menu.showPopover) { try { menu.showPopover(); } catch (e) {} }
}

document.getElementById('btnSortPool').onclick = (e) => {
  e.stopPropagation();
  if (!pool.length) return;
  openPoolSortMenu(e.currentTarget);
};

document.getElementById('btnSavePractice').onclick = () => {
  const name = document.getElementById('practiceName').value.trim();
  if (!name) { showToast('请先给练习命名'); return; }
  if (!pool.length) { showToast('请先加入至少一道题'); return; }
  if (PRACTICES[name]) {
    const sameIds = (PRACTICES[name].ids || []).join(',') === pool.join(',');
    confirmModal('名称已存在',
      `已存在名为「${name}」的练习，是否覆盖？` +
      (sameIds ? '（题目未变，做题进度会保留）' : '（题目已变化，原有的做题进度将被重置）'),
      () => {
        PRACTICES[name] = { name, ids: [...pool], createdAt: Date.now() };
        saveLS(LS_PRACTICES, PRACTICES);
        if (!sameIds) {
          // 同名覆盖 = 一份全新的练习，旧的进度、正确率、是否做过全部清空
          delete PROGRESS[name];
          saveLS(LS_PROGRESS, PROGRESS);
          if (runner && runner.name === name) { runner = null; }
        }
        showToast(sameIds ? '已覆盖保存' : '已覆盖保存，做题进度已重置');
        renderPracticeList();
      });
    return;
  }
  PRACTICES[name] = { name, ids: [...pool], createdAt: Date.now() };
  saveLS(LS_PRACTICES, PRACTICES);
  showToast('已保存到「我的练习」');
  renderPracticeList();
};

document.getElementById('btnRandom').onclick = () => {
  const n = parseInt(document.getElementById('randN').value, 10);
  if (!n || n < 1) { showToast('请输入有效数量'); return; }
  if (!currentFiltered.length) { showToast('当前没有可抽取的题目'); return; }
  const poolSet = new Set(pool);
  const avail = currentFiltered.filter(q => !poolSet.has(q.id));
  if (!avail.length) { showToast('当前筛选的题已全部加入练习'); return; }
  const take = Math.min(n, avail.length);
  for (let i = avail.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [avail[i], avail[j]] = [avail[j], avail[i]];
  }
  avail.slice(0, take).forEach(q => { if (!pool.includes(q.id)) pool.push(q.id); });
  renderPool();
  renderQuestionList();
  showToast(`已随机加入 ${take} 道题`);
};

document.getElementById('selectAllList').onchange = (e) => {
  const on = e.target.checked;
  document.querySelectorAll('#questionList input[type=checkbox]').forEach(cb => {
    cb.checked = on;
    const id = cb.dataset.id;
    if (on) { if (!pool.includes(id)) pool.push(id); }
    else { pool = pool.filter(x => x !== id); }
  });
  renderPool();
};

/* ============================================================
   模块2 - 我的练习
   ============================================================ */
function renderPracticeList() {
  hideCardMenu();
  const box = document.getElementById('takeList');
  const names = Object.keys(PRACTICES);
  box.innerHTML = '<h2>我的练习</h2><div class="sub">选择一份练习开始做题；点右侧 ⋯ 可导出 PDF、复制、编辑或删除。</div>';
  if (!names.length) {
    box.innerHTML += '<div class="emptyHint">还没有保存的练习，请先到「组卷」创建。</div>';
    return;
  }
  names.sort((a,b) => PRACTICES[b].createdAt - PRACTICES[a].createdAt);
  names.forEach(name => {
    const p = PRACTICES[name];
    const prog = PROGRESS[name];
    // 只统计仍属于这份练习的作答（旧版本遗留的题号不算）
    const ansMap = (prog && prog.answers) || {};
    const doneCount = p.ids.filter(id => ansMap[id]).length;
    // 有未交卷的作答记录 → 继续练习
    const inProgress = doneCount > 0 && !(prog && prog.finished);
    const card = document.createElement('div');
    card.className = 'practiceCard';
    card.innerHTML = `
      <div class="info">
        <div class="pname">${esc(name)}</div>
        <div class="pmeta">${p.ids.length} 题 ｜ 创建于 ${new Date(p.createdAt).toLocaleString('zh-CN')}
          ${doneCount?` ｜ 上次做到 ${doneCount}/${p.ids.length} 题`:''}</div>
      </div>
      <button class="go">${inProgress ? '继续练习' : '开始做题'}</button>
      <button class="more" title="更多操作" aria-label="更多操作">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
          <circle cx="4" cy="10" r="1.7"></circle>
          <circle cx="10" cy="10" r="1.7"></circle>
          <circle cx="16" cy="10" r="1.7"></circle>
        </svg>
      </button>`;
    card.querySelector('.go').onclick = () => openPractice(name);
    card.querySelector('.more').onclick = (e) => {
      e.stopPropagation();
      openCardMenu(e.currentTarget, name);
    };
    box.appendChild(card);
  });
}

/* ============================================================
   练习卡片「⋯」菜单：复制 / 编辑 / 删除
   （菜单按需动态创建，用完即移除）
   ============================================================ */
let cardMenuEl = null;
let menuPracticeName = null;

function hideCardMenu() {
  if (cardMenuEl) { cardMenuEl.remove(); cardMenuEl = null; }
  menuPracticeName = null;
}

function openCardMenu(btn, name) {
  const same = menuPracticeName === name && !!cardMenuEl;
  hideCardMenu();
  if (same) return;   // 再点一次同一个按钮 = 收起

  const menu = document.createElement('div');
  menu.className = 'cardMenu';
  // 顶层浮层（popover）：永远压在所有内容之上，不受滚动容器/层叠上下文影响
  menu.setAttribute('popover', 'manual');
  // 贴着按钮右缘向下展开；下方空间不足时向上展开
  const r = btn.getBoundingClientRect();
  const right = Math.max(8, window.innerWidth - r.right);
  const flipUp = r.bottom > window.innerHeight - 140;
  menu.style.cssText = 'inset:auto; margin:0;' + `right:${right}px;` + (flipUp
    ? `bottom:${window.innerHeight - r.top + 6}px;`
    : `top:${r.bottom + 6}px;`);
  menu.innerHTML = `
    <button data-act="export" class="sep">导出</button>
    <button data-act="copy">复制</button>
    <button data-act="edit">编辑</button>
    <button data-act="del" class="danger">删除</button>`;
  menu.querySelectorAll('button').forEach(b => {
    b.onclick = () => {
      const act = b.dataset.act;
      hideCardMenu();
      if (act === 'export') chooseExport(name);
      else if (act === 'copy') copyPractice(name);
      else if (act === 'edit') editPractice(name);
      else if (act === 'del') deletePractice(name);
    };
  });
  document.body.appendChild(menu);
  cardMenuEl = menu;
  menuPracticeName = name;
  if (menu.showPopover) { try { menu.showPopover(); } catch (e) {} }
}

function copyPractice(name) {
  const p = PRACTICES[name];
  if (!p) return;
  let n = `${name} 副本`, i = 2;
  while (PRACTICES[n]) n = `${name} 副本 ${i++}`;
  PRACTICES[n] = { name: n, ids: [...p.ids], createdAt: Date.now() };
  saveLS(LS_PRACTICES, PRACTICES);
  renderPracticeList();
  showToast(`已复制为「${n}」`);
}

function editPractice(name) {
  const p = PRACTICES[name];
  if (!p) return;
  pool = [...p.ids];
  switchScreen('screenCreate');
  renderPool();
  document.getElementById('practiceName').value = name;
  showToast('题目已载入组卷，改完用同名保存即可覆盖');
}

function deletePractice(name) {
  confirmModal('删除练习', `确定删除「${name}」吗？做题进度也会一并删除。`, () => {
    delete PRACTICES[name];
    delete PROGRESS[name];
    saveLS(LS_PRACTICES, PRACTICES);
    saveLS(LS_PROGRESS, PROGRESS);
    renderPracticeList();
    showToast('已删除');
  }, true);
}

/* ============================================================
   导出练习为 PDF（用浏览器打印引擎排版 → 「另存为 PDF」）
   ============================================================ */
function chooseExport(name) {
  if (!PRACTICES[name]) return;
  const modal = document.getElementById('modal');
  document.getElementById('modalTitle').textContent = `导出「${name}」`;
  const text = document.getElementById('modalText');
  text.className = 'expOpts';
  text.innerHTML = `
    <label class="expRow"><input type="checkbox" data-opt="answers" checked>
      <span class="expName">答案</span><span class="expHint">末尾附答案表</span></label>
    <label class="expRow"><input type="checkbox" data-opt="qid" checked>
      <span class="expName">来源</span><span class="expHint">题目编号</span></label>
    <label class="expRow"><input type="checkbox" data-opt="tags">
      <span class="expName">分类</span><span class="expHint">板块 · 知识点</span></label>
    <label class="expRow"><input type="checkbox" data-opt="diff">
      <span class="expName">难度</span><span class="expHint">Difficulty 标签</span></label>`;

  const btns = document.getElementById('modalBtns');
  btns.innerHTML = '';
  btns.style.flexDirection = '';
  btns.style.alignItems = '';
  const cancel = document.createElement('button');
  cancel.className = 'ghost';
  cancel.textContent = '取消';
  cancel.onclick = () => { modal.classList.remove('show'); resetModalText(); };
  const ok = document.createElement('button');
  ok.textContent = '确认导出';
  ok.onclick = () => {
    const opt = {};
    text.querySelectorAll('input[data-opt]').forEach(cb => { opt[cb.dataset.opt] = cb.checked; });
    modal.classList.remove('show');
    resetModalText();
    exportPracticePDF(name, opt);
  };
  btns.appendChild(cancel);
  btns.appendChild(ok);
  modal.classList.add('show');
}

function resetModalText() {
  const t = document.getElementById('modalText');
  t.className = '';
  t.innerHTML = '';
}

  const o = Object.assign({ answers: false, qid: true, tags: true, diff: true }, opt || {});
  const p = PRACTICES[name];
  if (!p) return '';
  const qs = (p.ids || []).map(id => LIB.find(q => q.id === id)).filter(Boolean);
  if (!qs.length) return '';

  const blocks = qs.map((q, i) => {

  <section class="ansSheet">
    <div class="ansHead">答案 <span class="ansSub">（${sub}）</span></div>
${rows}  </section>`;

  const now = new Date();
  const stamp = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

  return `<!DOCTYPE html>

  .tag { font-size: 8pt; line-height: 1.7; padding: 0 7px; border-radius: 9px; white-space: nowrap; }
  .tag.sec { background: #f0eafc; color: #6a46b8; }
  .tag.topic { background: #e6f1fd; color: #1f6fb8; }

let _exportFrame = null;
function exportPracticePDF(name, opt) {
  const html = buildExportHTML(name, opt);
  if (!html) { showToast('这份练习里没有可导出的题目'); return; }

  if (_exportFrame) { _exportFrame.remove(); _exportFrame = null; }
  const fr = document.createElement('iframe');
  fr.setAttribute('aria-hidden', 'true');
  // 放在视口外但保持正常渲染，打印不影响主页面
  fr.style.cssText = 'position:fixed;left:-10000px;top:0;width:794px;height:1123px;border:0;';
  document.body.appendChild(fr);
  _exportFrame = fr;

  const doc = fr.contentWindow.document;
  doc.open(); doc.write(html); doc.close();

  const fire = () => {
    try {
      fr.contentWindow.focus();
      fr.contentWindow.print();
      fr.contentWindow.addEventListener('afterprint', () => {
        setTimeout(() => { if (_exportFrame === fr) { fr.remove(); _exportFrame = null; } }, 300);
      });
    } catch (err) {
      const w = window.open('', '_blank');
      if (!w) { showToast('浏览器拦截了打印窗口，请允许弹窗后重试'); return; }
      w.document.open(); w.document.write(html); w.document.close();
      setTimeout(() => { try { w.focus(); w.print(); } catch (e) {} }, 600);
    }
  };

  const imgs = [...doc.images];
  const waitAll = imgs.map(im => (im.decode
    ? im.decode().catch(() => {})
    : new Promise(res => { im.complete ? res() : (im.onload = im.onerror = res); })));
  Promise.race([
    Promise.all(waitAll),
    new Promise(res => setTimeout(res, 6000))
  ]).then(() => setTimeout(fire, 120));

  showToast('正在生成 PDF… 在打印窗口选「另存为 PDF」');
}

function openPractice(name) {
  const p = PRACTICES[name];
  if (!p) return;
  const prog = PROGRESS[name];
  const ansMap = (prog && prog.answers) || {};
  const hasProgress = !!prog && !prog.finished && p.ids.some(id => ansMap[id]);
  const startWithMode = (mode, resume) => startRunner(name, mode, resume);
  showChoiceModal(`${name}`,
    hasProgress ? '检测到上次未完成的进度，是否继续？' : '选择作答模式：',
    hasProgress
      ? [
          { label:'继续上次进度', primary:true, action:()=> startWithMode(prog.mode || 'instant', true) },
          { label:'重新开始（即时判答）', action:()=> startWithMode('instant', false) },
          { label:'重新开始（交卷批改）', action:()=> startWithMode('exam', false) },
          { label:'取消', ghost:true, action:()=>{} }
        ]
      : [
          { label:'模式1 即时判答', primary:true, action:()=> startWithMode('instant', false) },
          { label:'模式2 交卷批改', action:()=> startWithMode('exam', false) },
          { label:'取消', ghost:true, action:()=>{} }
        ]);
}

/* ============================================================
   做题运行器
   ============================================================ */
let timerInterval = null;

function startRunner(name, mode, resume) {
  const p = PRACTICES[name];
  const validIds = p.ids.filter(id => LIB.some(q => q.id === id));
  if (!validIds.length) { showToast('这份练习的题目在当前题库中找不到（请先导入题库CSV）'); return; }

  let answers = {}, index = 0, elapsed = 0;
  if (resume && PROGRESS[name]) {
    // 只保留仍在这份练习里的题目的作答，避免旧题号污染正确率
    const raw = PROGRESS[name].answers || {};
    validIds.forEach(id => { if (raw[id]) answers[id] = raw[id]; });
    index = PROGRESS[name].index || 0;
    elapsed = PROGRESS[name].elapsed || 0;
    mode = PROGRESS[name].mode || mode;
  }

  runner = { name, mode, ids: validIds, answers, index, elapsed, finished:false,
             qTimes: {}, qEnterAt: Date.now(), qEnterQid: null };

  document.getElementById('takeList').classList.add('hidden');
  document.getElementById('resultView').classList.remove('active');
  document.getElementById('runner').classList.add('active');
  document.querySelectorAll('#topbar .tbBtn').forEach(t => t.classList.toggle('active', t.dataset.screen === 'screenTake'));

  document.getElementById('runnerName').textContent = name;
  document.getElementById('modeLabel').textContent = mode === 'instant' ? '模式：即时判答' : '模式：交卷批改';
  document.getElementById('btnSubmitPractice').classList.toggle('hidden', mode !== 'exam');
  document.getElementById('legendMark').classList.toggle('hidden', mode !== 'instant');

  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (!runner || runner.finished) return;
    runner.elapsed++;
    document.getElementById('timer').textContent = fmtTime(runner.elapsed);
    if (runner.elapsed % 5 === 0) persistProgress();
  }, 1000);
  document.getElementById('timer').textContent = fmtTime(runner.elapsed);

  renderRunner();
}

function persistProgress() {
  if (!runner) return;
  PROGRESS[runner.name] = {
    answers: runner.answers, index: runner.index, elapsed: runner.elapsed,
    mode: runner.mode, finished: runner.finished
  };
  saveLS(LS_PROGRESS, PROGRESS);
}

/* ---------- 做题页顶栏：题目编号 + 板块/知识点/难度标签 ---------- */
function paintRunnerMeta(q) {
  document.getElementById('runnerQid').textContent = q.id || '';

  const sec = document.getElementById('runnerSec');
  if (q.section) {
    sec.textContent = secFull(q.section);
    sec.classList.remove('hidden');
  } else {
    sec.classList.add('hidden');
  }

  const topic = document.getElementById('runnerTopic');
  if (q.topic) {
    topic.className = 'tag topic';
    topic.textContent = q.topic;
  } else {
    /* 题库缺知识点时也占一个位，避免标签凭空消失 */
    topic.className = 'tag miss';
    topic.textContent = '知识点未标注';
  }

  const diff = document.getElementById('runnerDiff');
  if (q.difficulty) {
    diff.className = 'tag diff d' + q.difficulty;
    diff.textContent = `Difficulty ${q.difficulty}`;
  } else {
    diff.className = 'tag diff hidden';
    diff.textContent = '';
  }

  updateAccStat();
}

/* ---------- 侧栏左上：已做题目的正确率 ---------- */
function updateAccStat() {
  const el = document.getElementById('accStat');
  if (!el) return;
  if (!runner) { el.textContent = ''; return; }

  const total = runner.ids.length;
  const answeredIds = runner.ids.filter(id => runner.answers[id]);

  if (runner.mode !== 'instant') {
    el.innerHTML = `已做 <b>${answeredIds.length}</b> / ${total}`;
    return;
  }
  if (!answeredIds.length) {
    el.innerHTML = `正确率 <b>—</b>`;
    return;
  }
  let right = 0;
  answeredIds.forEach(id => {
    const lq = LIB.find(x => x.id === id);
    if (lq && lq.answer && runner.answers[id] === lq.answer.trim().toUpperCase()) right++;
  });
  const pct = Math.round(right / answeredIds.length * 100);
  el.innerHTML = `正确率 <b>${pct}%</b> <span class="ok">${right} 对</span>` +
                 `<span style="color:#c8d0dc"> / </span><span class="no">${answeredIds.length - right} 错</span>`;
}

function renderRunner() {
  clearAutoAdvance();
  const qid = runner.ids[runner.index];
  /* 单题计时：只有真正换题才重新起表，同一题重绘不打断 */
  if (runner.qEnterQid !== qid) { runner.qEnterAt = Date.now(); runner.qEnterQid = qid; }
  const q = LIB.find(x => x.id === qid);
  if (!q) { showToast('题目丢失'); return; }

  document.getElementById('qImg').src = 'img/' + q.image;
  paintRunnerMeta(q);

  const optArea = document.getElementById('optArea');
  optArea.innerHTML = '';
  const letters = ['A','B','C','D'];
  const picked = runner.answers[qid];
  const correct = q.answer ? q.answer.trim().toUpperCase() : '';

  letters.forEach(L => {
    const btn = document.createElement('div');
    btn.className = 'optBtn';
    btn.innerHTML = `<span class="letter">${L}</span><span class="otxt">选项 ${L}</span>`;
    if (picked === L) btn.classList.add('picked');
    if (runner.mode === 'instant' && picked) {
      btn.classList.add('locked');
      if (L === correct) btn.classList.add('correct');
      else if (L === picked) btn.classList.add('wrong');
    }
    if (!(runner.mode === 'instant' && picked)) {
      btn.onclick = () => chooseOption(L);
    } else {
      btn.classList.add('locked');
    }
    optArea.appendChild(btn);
  });

  const fb = document.getElementById('feedback');
  if (runner.mode === 'instant' && picked) {
    const isRight = picked === correct;
    fb.className = 'show ' + (isRight ? 'ok' : 'no');
    fb.textContent = isRight ? `✅ 回答正确！（答案 ${correct}）`
      : `❌ 回答错误。你选了 ${picked}，正确答案是 ${correct}。`;
  } else {
    fb.className = '';
    fb.textContent = '';
  }

  renderNumPanel();

  const last = runner.ids.length - 1;
  document.getElementById('navPos').textContent = `第 ${runner.index + 1} / ${runner.ids.length} 题`;
  document.getElementById('btnPrevQ').disabled = runner.index === 0;
  document.getElementById('btnNextQ').disabled = runner.index >= last;
}

/* ---------- 翻页 / 自动跳题 ---------- */
const AUTO_NEXT_MS = 2000;
let autoTimer = null, autoTick = null;

function clearAutoAdvance() {
  if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
  if (autoTick) { clearInterval(autoTick); autoTick = null; }
  const h = document.getElementById('autoHint');
  if (h) h.textContent = '';
}

function scheduleAutoAdvance() {
  clearAutoAdvance();
  if (!runner || runner.finished) return;
  const hint = document.getElementById('autoHint');
  if (!hint) return;
  if (runner.index >= runner.ids.length - 1) {
    hint.textContent = '已是最后一题';
    autoTimer = setTimeout(() => { hint.textContent = ''; autoTimer = null; }, 2000);
    return;
  }
  let left = Math.round(AUTO_NEXT_MS / 1000);
  const paint = () => { hint.textContent = `⏳ ${left} 秒后自动下一题　按 Esc 取消自动跳题`; };
  paint();
  autoTick = setInterval(() => {
    left -= 1;
    if (left > 0) paint();
  }, 1000);
  autoTimer = setTimeout(() => {
    autoTimer = null;
    if (!runner || runner.finished) return;
    goTo(runner.index + 1);
  }, AUTO_NEXT_MS);
}

function goTo(i) {
  if (!runner || runner.finished) return;
  const n = runner.ids.length;
  if (i < 0 || i > n - 1 || i === runner.index) return;
  clearAutoAdvance();
  runner.index = i;
  persistProgress();
  renderRunner();
}

function chooseOption(L) {
  const qid = runner.ids[runner.index];
  runner.answers[qid] = L;
  /* 记录这道题的停留秒数（从进入本题开始算） */
  runner.qTimes[qid] = Math.max(1, Math.round((Date.now() - (runner.qEnterAt || Date.now())) / 1000));
  persistProgress();
  if (runner.mode === 'exam') {
    /* 模式2 交卷批改：点选后立即跳到下一题，不等待倒计时 */
    if (runner.index < runner.ids.length - 1) runner.index += 1;
    persistProgress();
    renderRunner();
    return;
  }
  /* 即时判答：点选就上报这一题 */
  sbPushAttempts([collectAttempt(qid, L, 'instant')]);
  renderRunner();
  scheduleAutoAdvance();
}

document.getElementById('btnPrevQ').onclick = () => { if (runner) goTo(runner.index - 1); };
document.getElementById('btnNextQ').onclick = () => { if (runner) goTo(runner.index + 1); };

document.addEventListener('keydown', (e) => {
  if (!runner || runner.finished) return;
  if (!document.getElementById('runner').classList.contains('active')) return;
  if (document.getElementById('modal').classList.contains('show')) return;
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(runner.index - 1); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); goTo(runner.index + 1); }
  else if (e.key === 'Escape') { clearAutoAdvance(); }
});

function renderNumPanel() {
  const panel = document.getElementById('numPanel');
  panel.innerHTML = '';
  runner.ids.forEach((id, i) => {
    const b = document.createElement('div');
    b.className = 'numBtn';
    b.textContent = i + 1;
    const ans = runner.answers[id];
    if (ans) b.classList.add('answered');
    if (i === runner.index) b.classList.add('current');
    if (runner.mode === 'instant' && ans) {
      const libQ = LIB.find(x => x.id === id);
      const correct = libQ && libQ.answer ? libQ.answer.trim().toUpperCase() : '';
      if (ans === correct) b.classList.add('correctMark');
      else b.classList.add('wrongMark');
    }
    b.onclick = () => goTo(i);
    panel.appendChild(b);
  });
}

document.getElementById('btnSubmitPractice').onclick = () => {

  confirmModal('提交批改', msg, () => doSubmit());
};

function doSubmit() {
  clearInterval(timerInterval);
  clearAutoAdvance();
  runner.finished = true;
  persistProgress();
  /* 交卷后一次性上报全部题目（未作答按错计） */
  sbPushAttempts(runner.ids.map(id => collectAttempt(id, runner.answers[id] || null, 'exam')));

  let right = 0;
  const wrongList = [];
  runner.ids.forEach((id, i) => {
    const q = LIB.find(x => x.id === id);
    const correct = q && q.answer ? q.answer.trim().toUpperCase() : '';
    const your = runner.answers[id] || '';
    if (your && your === correct) right++;
    else wrongList.push({ id, q, your, correct, no: i + 1 });
  });
  const total = runner.ids.length;
  const pct = total ? (right / total * 100).toFixed(1) : 0;

  document.getElementById('runner').classList.remove('active');
  document.getElementById('takeList').classList.add('hidden');
  const rv = document.getElementById('resultView');
  rv.classList.add('active');

  const body = document.getElementById('resultBody');
  body.innerHTML = `
    <div id="scoreCard">
      <div class="big">${right} / ${total}</div>
      <div class="pct">得分率 ${pct}% ｜ 用时 ${fmtTime(runner.elapsed)}</div>
      <div class="detail">答对 ${right} 题，答错/未答 ${total - right} 题</div>
    </div>
    <div style="max-width:880px;margin:0 auto 12px;display:flex;gap:10px">
      <button id="btnBackToList" style="border:none;padding:9px 18px;border-radius:6px;cursor:pointer;background:#fff;border:1px solid #dfe3ea;color:#374151;font-family:inherit">返回我的练习</button>
      <button id="btnRetry" style="border:none;padding:9px 18px;border-radius:6px;cursor:pointer;background:#002985;color:#fff;font-family:inherit">重新做一遍</button>
    </div>
    ${wrongList.length ? '<h3 style="max-width:880px;margin:20px auto 12px;color:#1f3a5f">❌ 错题回顾</h3>' : '<div style="max-width:880px;margin:0 auto;color:#2f6f45;font-size:15px">🎉 全部正确！</div>'}
  `;
  wrongList.forEach(w => {
    const d = document.createElement('div');
    d.className = 'wrongItem';
    d.dataset.no = w.no;
    const q = w.q || {};
    const secTxt = q.section ? secFull(q.section) : '';
    const topicTxt = q.topic || '';
    d.innerHTML = `
      <div class="wid">
        <span class="tag qno">No. ${w.no}</span>
        <span class="qid-pill">${esc(w.id)}</span>
        ${secTxt ? `<span class="tag sec" title="${esc(secTxt)}">${esc(secTxt)}</span>` : ''}
        ${topicTxt
          ? `<span class="tag topic" title="${esc(topicTxt)}">${esc(topicTxt)}</span>`
          : `<span class="tag miss">知识点未标注</span>`}
        ${q.difficulty ? `<span class="tag diff d${q.difficulty}">Difficulty ${q.difficulty}</span>` : ''}
      </div>
      <img src="img/${q.image || ''}" alt="">
      <div class="ansLine">
        <span class="your">你的答案：${w.your || '未作答'}</span> ｜
        <span class="right">正确答案：${w.correct || '?'}</span>
      </div>`;
    body.appendChild(d);
  });

  renderResultNav(wrongList);
  document.getElementById('resultStat').innerHTML =
    `本题共 <b>${total}</b> 题 ｜ <span style="color:#2f6f45">对 ${right}</span> ｜ <span style="color:#c0392b">错 ${total - right}</span>`;

  document.getElementById('btnBackToList').onclick = () => {
    rv.classList.remove('active');
    renderPracticeList();
    renderTakeDefault();
  };
  document.getElementById('btnRetry').onclick = () => {
    delete PROGRESS[runner.name];
    saveLS(LS_PROGRESS, PROGRESS);
    rv.classList.remove('active');
    const nm = runner.name, md = runner.mode;
    runner = null;
    startRunner(nm, md, false);
  };
}

/* ============================================================
   结果页：右侧题号导航（点题号跳到对应错题）
   ============================================================ */
function renderResultNav(wrongList) {
  const panel = document.getElementById('resultNumPanel');
  if (!panel) return;
  panel.innerHTML = '';
  const wrongNos = new Set(wrongList.map(w => w.no));
  runner.ids.forEach((id, i) => {
    const no = i + 1;
    const b = document.createElement('div');
    b.className = 'numBtn';
    b.dataset.no = String(no);
    b.textContent = no;
    if (wrongNos.has(no)) {
      b.classList.add('wrongMark', 'canJump');
      b.title = `第 ${no} 题答错，点击跳转`;
      b.onclick = () => focusWrong(no);
    } else {
      b.classList.add('correctMark');
      b.title = `第 ${no} 题答对`;
    }
    panel.appendChild(b);
  });
  syncResultNav();
}

function markResultCurrent(no) {
  const panel = document.getElementById('resultNumPanel');
  if (!panel) return;
  panel.querySelectorAll('.numBtn').forEach(b => {
    b.classList.toggle('current', b.dataset.no === String(no));
  });
}

function focusWrong(no) {
  const body = document.getElementById('resultBody');
  const card = body.querySelector(`.wrongItem[data-no="${no}"]`);
  if (!card) return;
  const top = Math.max(0, card.offsetTop - 14);
  const startTop = body.scrollTop;
  body.scrollTo({ top, behavior: 'smooth' });
  /* 兜底：若浏览器没跑平滑滚动（如无头/减动效），直接跳过去 */
  setTimeout(() => {
    if (Math.abs(body.scrollTop - top) > 4 && body.scrollTop === startTop) body.scrollTop = top;
  }, 480);
  markResultCurrent(no);
  card.classList.add('focus');
  clearTimeout(card._focusTimer);
  card._focusTimer = setTimeout(() => card.classList.remove('focus'), 1500);
}

/* 滚动错题列表时，高亮当前看到的那道错题 */
function syncResultNav() {
  const body = document.getElementById('resultBody');
  const panel = document.getElementById('resultNumPanel');
  if (!body || !panel || !panel.children.length) return;
  const base = body.scrollTop + 70;
  let cur = '';
  body.querySelectorAll('.wrongItem').forEach(card => {
    if (card.offsetTop <= base) cur = card.dataset.no;
  });
  panel.querySelectorAll('.numBtn').forEach(b => {
    b.classList.toggle('current', cur !== '' && b.dataset.no === cur);
  });
}

document.getElementById('resultBody').addEventListener('scroll', () => {
  if (!document.getElementById('resultView').classList.contains('active')) return;
  if (syncResultNav._raf) return;
  syncResultNav._raf = requestAnimationFrame(() => {
    syncResultNav._raf = 0;
    syncResultNav();
  });
});

/* ============================================================
   通用弹窗
   ============================================================ */
function confirmModal(title, text, onOk, danger) {
  const modal = document.getElementById('modal');
  document.getElementById('modalTitle').textContent = title;
  resetModalText();
  document.getElementById('modalText').textContent = text;
  const btns = document.getElementById('modalBtns');
  btns.innerHTML = '';
  btns.style.flexDirection = '';
  btns.style.alignItems = '';
  const ok = document.createElement('button');
  ok.textContent = '确定';
  if (danger) ok.style.background = '#e57373';
  ok.onclick = () => { modal.classList.remove('show'); onOk && onOk(); };
  const cancel = document.createElement('button');
  cancel.className = 'ghost'; cancel.textContent = '取消';
  cancel.onclick = () => modal.classList.remove('show');
  btns.appendChild(cancel); btns.appendChild(ok);
  modal.classList.add('show');
}

function showChoiceModal(title, text, options) {
  const modal = document.getElementById('modal');
  document.getElementById('modalTitle').textContent = title;
  resetModalText();
  document.getElementById('modalText').textContent = text;
  const btns = document.getElementById('modalBtns');
  btns.innerHTML = '';
  btns.style.flexDirection = 'column';
  btns.style.alignItems = 'stretch';
  options.forEach(o => {
    const b = document.createElement('button');
    b.textContent = o.label;
    if (o.ghost) b.className = 'ghost';
    b.style.marginBottom = '6px';
    b.onclick = () => { modal.classList.remove('show'); o.action && o.action(); };
    btns.appendChild(b);
  });
  modal.classList.add('show');
}

function previewImage(src) {
  document.getElementById('imgPreviewImg').src = src;
  document.getElementById('imgPreview').classList.add('show');
}
document.getElementById('imgPreview').onclick = () => {
  document.getElementById('imgPreview').classList.remove('show');
};

/* ============================================================

function switchScreen(id) {
